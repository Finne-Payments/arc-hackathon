# Finné web — nginx config.
# Serves the SPA static files and proxies /api to the backend container.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html (React Router handles client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — /api/* goes to the backend container
    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json;
}
