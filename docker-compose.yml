# Finné — one-command Docker deployment.
#
# Usage:
#   cp .env.example .env           # edit MONGO_URL (Atlas) or leave default
#   docker compose up --build      # web on :5173, backend on :4000
#   docker compose down            # stop
#
# MongoDB: if .env has MONGO_URL pointing to Atlas, the backend uses it
# directly. The local mongo service also starts but is unused — stop it
# with:  docker compose stop mongo
#
# External credentials (Arc, Circle, AWS, IdP) are read from .env if present.

services:
  # ── MongoDB (local fallback; ignored if .env MONGO_URL points to Atlas) ──
  mongo:
    image: mongo:7
    container_name: finne-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Express API + indexer + scheduler) ─────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finne-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    env_file:
      - .env
    environment:
      NODE_ENV: local
      BACKEND_PORT: "4000"
      DEMO_MODE: "true"
      # MONGO_URL comes from .env (Atlas) — if absent, falls back to local container
    ports:
      - "4000:4000"

  # ── Web (React SPA served by nginx, proxies /api → backend) ─────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: finne-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo-data:
