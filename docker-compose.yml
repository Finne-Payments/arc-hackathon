# Finné — one-command Docker deployment.
#
# Usage:
#   cp .env.example .env           # edit MONGO_URL (Atlas) or leave default
#   docker compose up --build      # web on :5173, backend on :4000
#   docker compose down            # stop
#
# MongoDB: if .env has MONGO_URL pointing to Atlas, the backend uses it
# directly. The local mongo service also starts but is unused — stop it
# with:  docker compose stop mongo
#
# External credentials (Arc, Circle, AWS, IdP) are read from .env if present.

services:
  # ── MongoDB (local fallback; ignored if .env MONGO_URL points to Atlas) ──
  mongo:
    image: mongo:7
    container_name: finne-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Express API + indexer + scheduler) ─────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finne-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    env_file:
      - .env
    environment:
      NODE_ENV: local
      BACKEND_PORT: "4000"
      DEMO_MODE: "true"
      # MONGO_URL comes from .env (Atlas) — if absent, falls back to local container
      # Bedrock auth: the SDK reads AWS_PROFILE and looks it up in ~/.aws/credentials.
      # The host's ~/.aws is mounted read-only below (into the node user's home, since
      # the container runs as USER node uid 1000). This is a local-dev convenience —
      # prod ECS uses the task role, not a mounted profile.
      AWS_PROFILE: "${AWS_PROFILE:-finne}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
    volumes:
      # Read-only mount of the host AWS config so the container can resolve the
      # AWS_PROFILE for Bedrock (IAM auth, not an API key). Harmless if absent.
      - "${HOME}/.aws:/home/node/.aws:ro"
    ports:
      - "4000:4000"

  # ── Web (React SPA served by nginx, proxies /api → backend) ─────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: finne-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  # ── Model runtime (PRD Addendum A / FIN-100) ─────────────────────────────
  # Self-hosted open weights on Finné-controlled machines (P9/D7). No vendor
  # key — the endpoint is an internal HTTP URL. Two profiles:
  #
  #   docker compose --profile dev up   → Ollama (CPU/Metal; Mac dev laptop)
  #   docker compose --profile gpu up   → vLLM (NVIDIA GPU; AWS EC2 g5/g6 prod)
  #
  # The gpu profile BUILDS model/Dockerfile — a vLLM image with the weights
  # baked in at build time, so a fresh box doesn't re-download the model on
  # first request (the slow cold-start). Build once: ./scripts/model-bake.sh
  #
  # Backend reaches it at http://model:8000/v1 (or 11434 for Ollama). Set
  # MODEL_BASE_URL + MODEL_NAME in .env to match the running profile.
  # When neither profile is active, the backend runs models-unplugged (FIN-105):
  # every agent station degrades to templates + computation (P8).
  model-vllm:
    build:
      context: .
      dockerfile: model/Dockerfile
      args:
        # Served model is baked into the image at build time. Default is the
        # production default (see docs/models.md). Swap via the FIN-100 rule:
        # rebuild + MODEL_NAME in .env + docs/models.md note.
        MODEL_NAME: "${MODEL_NAME:-Qwen/Qwen2.5-3B-Instruct}"
        HF_HUB_TOKEN: "${HF_HUB_TOKEN:-}"
    image: finne-model:latest
    container_name: finne-model-vllm
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Health: vLLM is ready when /v1/models returns 200. The backend waits on
    # this (depends_on:service_healthy) instead of hitting a cold endpoint and
    # degrading the first call. start_period covers the VRAM load (~1–3 min).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  model-ollama:
    image: ollama/ollama:latest
    container_name: finne-model-ollama
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  mongo-data:
  ollama-models:
